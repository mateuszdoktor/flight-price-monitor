services:
  postgres:
    image: postgres:16-alpine
    container_name: flight-price-monitor-postgres
    environment:
      POSTGRES_DB: flight_price_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight_price_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-price-monitor-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flight_price_monitor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AMADEUS_API_KEY: demo-key
      AMADEUS_API_SECRET: demo-secret
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
