spring.application.name=flight-price-monitor
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
amadeus.api-key=${AMADEUS_API_KEY}
amadeus.api-secret=${AMADEUS_API_SECRET}
amadeus.base-url=https://test.api.amadeus.com
amadeus.resilience.retry-max-attempts=3
amadeus.resilience.retry-wait-duration-ms=200
amadeus.resilience.circuit-breaker-sliding-window-size=20
amadeus.resilience.circuit-breaker-minimum-number-of-calls=10
amadeus.resilience.circuit-breaker-failure-rate-threshold=50
amadeus.resilience.circuit-breaker-wait-duration-ms=10000
amadeus.resilience.timeout-ms=3000
amadeus.resilience.fallback-max-age-minutes=30
scheduler.price-fetch.interval-ms=21600000
anomaly.min-samples=5
anomaly.z-score-threshold=2.0
anomaly.percentage-threshold=0.7
logging.level.com.flight_price_monitor=DEBUG
logging.level.com.flight_price_monitor.infrastructure.amadeus=DEBUG